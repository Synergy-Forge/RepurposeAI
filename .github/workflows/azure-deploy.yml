name: Deploy to Azure

on:
  push:
    branches:
      - main
      - preview  # Add preview branch for testing

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # ADD THIS STEP: Install dependencies first
      - name: Install dependencies
        run: npm ci

      # ADD THIS STEP: Run database migrations before build
      - name: Run Database Migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Run build script
        run: |
          chmod +x ./scripts/deploy.sh
          ./scripts/deploy.sh
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          # ADD EMAIL VARIABLES WHEN READY
          # ZEPTOMAIL_FROM_EMAIL: ${{ secrets.ZEPTOMAIL_FROM_EMAIL }}
          # ZEPTOMAIL_SMTP_HOST: ${{ secrets.ZEPTOMAIL_SMTP_HOST }}
          # ZEPTOMAIL_SMTP_PORT: ${{ secrets.ZEPTOMAIL_SMTP_PORT }}
          # ZEPTOMAIL_SMTP_USER: ${{ secrets.ZEPTOMAIL_SMTP_USER }}
          # ZEPTOMAIL_SMTP_PASS: ${{ secrets.ZEPTOMAIL_SMTP_PASS }}

      - name: Prepare standalone deployment
        run: |
          # Copy static files to standalone directory
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          # Copy prisma directory for database operations
          cp -r prisma .next/standalone/

      # MODIFY THIS STEP: Deploy to correct slot based on branch
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: "repurposeai-webapp"
          slot-name: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
          publish-profile: ${{ github.ref == 'refs/heads/main' && secrets.AZURE_WEBAPP_PUBLISH_PROFILE || secrets.AZURE_WEBAPP_PUBLISH_PROFILE_PREVIEW }}
          package: .next/standalone

      # UPDATE THIS STEP: Remove migration from startup (already done above)
      - name: Set startup command
        run: |
          SLOT_NAME=${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
          az webapp config set --name repurposeai-webapp --resource-group repurposeai-rg --slot $SLOT_NAME --startup-file "node server.js"
