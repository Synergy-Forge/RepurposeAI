name: Deploy Worker

on:
  push:
    branches:
      - main
    paths:
      - "Dockerfile.worker"
      - "src/lib/redis/**"
      - "src/lib/queues/**"
      - "src/lib/workers/**"
      - ".github/workflows/worker.yml"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      ACR_LOGIN_SERVER: ${{ secrets.AZURE_ACR_NAME }}.azurecr.io
      IMAGE_NAME: ${{ secrets.AZURE_ACR_NAME }}.azurecr.io/repurposeai-worker:${{ github.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure containerapp extension
        run: |
          az extension add --name containerapp --upgrade

      - name: Azure Container Registry login
        run: az acr login --name ${{ secrets.AZURE_ACR_NAME }}

      - name: Build and push worker image
        run: |
          docker build -f Dockerfile.worker -t $IMAGE_NAME .
          docker push $IMAGE_NAME

      - name: Deploy worker to Azure Container Apps
        run: |
          az containerapp update \
            --name ${{ secrets.AZURE_CONTAINERAPP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --image $IMAGE_NAME

    # Secrets necessários:
    # - AZURE_CLIENT_ID
    # - AZURE_TENANT_ID
    # - AZURE_SUBSCRIPTION_ID
    # - AZURE_ACR_NAME
    # - AZURE_RESOURCE_GROUP
    # - AZURE_CONTAINERAPP_NAME
